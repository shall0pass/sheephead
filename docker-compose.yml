# Clabber - full stack (web app + Automerge sync server).
#
#   docker compose up --build
#   -> open http://localhost:8080
#
# The browser connects to the sync server at ws://localhost:3030, which is the
# build-time default baked into the web image. For a real deployment, put the
# sync server behind TLS and rebuild the web image against its public URL:
#
#   CLABBER_SYNC_URL=wss://sync.example.com docker compose up --build
#
# (CLABBER_SYNC_URL is used only here, so it does not collide with the
# PUBLIC_SYNC_URL in the local dev .env file.)

services:
  sync:
    build: ./sync-server
    environment:
      PORT: '3030'
      DATA_DIR: /data
    ports:
      - '3030:3030'
    volumes:
      - sync-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        PUBLIC_SYNC_URL: ${CLABBER_SYNC_URL:-ws://localhost:3030}
    ports:
      - '8080:80'
    depends_on:
      - sync
    restart: unless-stopped

volumes:
  sync-data:
